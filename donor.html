<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donor Registration</title>
    <link rel="stylesheet" href="donor.css">
</head>
<body>

<header>
    <h2>Blood Donation Management System</h2>

   <nav>
    <a href="index.html">Home</a>
    <a href="donor.html">Donate</a>
    <a href="request.html">Request</a>
    <a href="availability.html">Availability</a>
    <a href="admin-login.html">Admin</a>
</nav>
</header>

<section class="container">

    <div class="form-box">

        <h1>Become a Blood Donor</h1>

        <form id="donorForm">

            <input type="text" placeholder="Full Name" id="name" required>

            <input type="text" placeholder="NIC Number" required>

            <input type="number" placeholder="Age" required>

            <select required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <select required>
                <option value="">Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <input type="tel" placeholder="Phone Number" required>

            <input type="email" placeholder="Email Address" required>

            <textarea placeholder="Address" rows="4"></textarea>

            <input type="password" placeholder="Create Password" required>

            <button type="submit">Register</button>

        </form>

    </div>

</section>

<script src="donor.js"></script>

</body>
</html>
